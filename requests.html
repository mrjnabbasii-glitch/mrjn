<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<header class="header">
  <a class="brand" href="index.html" aria-label="صفحه اصلی"><span class="brand-mark"><img src="logo.png" alt="لوگوی سازمان بنادر و دریانوردی"></span></a>
  <nav class="nav" aria-label="ناوبری اصلی"><a class="" href="index.html"><span>داشبورد</span></a><a class="" href="register.html"><span>ثبت خرابی</span></a><a class="active" href="requests.html"><span>درخواست‌ها</span></a><a class="" href="tracking.html"><span>پیگیری</span></a></nav>

<main><div class="container">
<section class="hero"><h1>لیست درخواست‌ها</h1><p class="lead">جستجو و فیلتر درخواست‌ها بر اساس نوع، وضعیت و اولویت.</p></section>
<section class="filterbar">
<input id="searchInput" type="search" placeholder="جستجو در عنوان، محل یا توضیحات...">
<select id="categoryFilter"><option value="all">همه دسته‌ها</option><option>برق</option><option>آب</option><option>آسانسور</option><option>سرمایش</option><option>تجهیزات</option></select>
<select id="statusFilter"><option value="all">همه وضعیت‌ها</option><option value="new">جدید</option><option value="review">در حال بررسی</option><option value="repair">در حال تعمیر</option><option value="done">انجام شده</option></select>
<select id="priorityFilter"><option value="all">همه اولویت‌ها</option><option>عادی</option><option>فوری</option><option>خیلی فوری</option></select>
</section>
<section id="requestList" class="request-list"></section>
</div></main>
<script src="js/script.js"></script>
