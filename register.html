<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبت خرابی | سامانه ثبت و پیگیری خرابی</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <a class="brand" href="index.html" aria-label="صفحه اصلی"><span class="brand-mark"><img src="logo.png" alt="لوگوی سازمان بنادر و دریانوردی"></span></a>
  <nav class="nav" aria-label="ناوبری اصلی"><a class="" href="index.html"><span>داشبورد</span></a><a class="active" href="register.html"><span>ثبت خرابی</span></a><a class="" href="requests.html"><span>درخواست‌ها</span></a><a class="" href="tracking.html"><span>پیگیری</span></a></nav>
</header>
<main><div class="container">
<section class="hero"><h1>ثبت خرابی</h1></section>
<section class="panel"><form id="requestForm">
<div class="form-grid">
<div class="field"><label for="requester">نام ثبت‌کننده</label><input id="requester" name="requester" type="text" placeholder="مثلاً مریم عباسی"></div>
<div class="field"><label for="location">محل خرابی</label><input id="location" name="location" type="text" placeholder="مثلاً ساختمان اداری، طبقه ۲"></div>
<div class="field"><label for="category">دسته‌بندی خرابی</label><select id="category" name="category"><option value="">انتخاب کنید</option><option>برق</option><option>آب</option><option>آسانسور</option><option>سرمایش</option><option>تجهیزات</option></select></div>
<div class="field"><label for="priority">اولویت پیشنهادی</label><select id="priority" name="priority"><option>عادی</option><option>فوری</option><option>خیلی فوری</option></select></div>
<div class="field"><label for="date">تاریخ ثبت</label><input id="date" name="date" type="date"></div>
<div class="field full"><label for="description">شرح خرابی</label><textarea id="description" name="description" placeholder="مشکل را دقیق و کوتاه بنویسید"></textarea></div>
</div><div class="actions"><button class="btn" type="submit">ثبت درخواست</button><button class="btn secondary" type="reset">پاک کردن فرم</button></div>

</form></section>
</div></main>
<script src="js/script.js"></script>
</body>
</html>
